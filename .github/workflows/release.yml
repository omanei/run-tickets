name: release

# A tag with the bare version (0.5.0) publishes it to PyPI and makes the GitHub Release.
# The tag can be pushed from git, or made by publishing a release in the web UI
# (Releases -> Draft a new release -> new tag 0.5.0 on master); either way works.
# Run by hand (Actions -> release -> Run workflow) to publish the current code to TestPyPI
# as a dry run. Publishing uses PyPI trusted publishing: no token in the repository.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag, the versions and the changelog agree
        if: github.event_name == 'push'
        run: python .github/scripts/release_check.py "$GITHUB_REF_NAME" > notes.md
      - run: python -m pip install pytest build twine "rich>=13"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes
      # A tag pushed from git has no release yet: create it. A release published in the web
      # UI (which made the tag) is filled in instead: the changelog notes when its
      # description was left empty, the title when it has none, and the built files.
      - name: Create or fill in the GitHub Release
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" dist/* --title "$tag" --notes-file notes.md
            exit 0
          fi
          if [ -z "$(gh release view "$tag" --json body --jq .body | tr -d '[:space:]')" ]; then
            gh release edit "$tag" --notes-file notes.md
          fi
          if [ -z "$(gh release view "$tag" --json name --jq .name)" ]; then
            gh release edit "$tag" --title "$tag"
          fi
          gh release upload "$tag" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
