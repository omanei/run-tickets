name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest "tomli; python_version < '3.11'"
      # rich is optional at run time: 3.13 tests the live view with it, 3.9 without it.
      - if: matrix.python == '3.13'
        run: python -m pip install "rich>=13"
      - run: python -m pytest -v
