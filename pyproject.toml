[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "run-tickets"
version = "0.1.0"
description = "Runs a feature's tickets one by one with a coding agent (omp, pi, Claude Code, Codex): implement, review, verify, resume after a crash."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ['tomli>=1.1; python_version < "3.11"']

[project.scripts]
run-tickets = "run_tickets:main"

[tool.setuptools]
py-modules = ["run_tickets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
